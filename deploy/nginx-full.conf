# =====================================================================
# 小语手记 · Nginx 统一入口（80）
#   /api/ai/*  → FastAPI AI 服务（SSE 流式，必须关闭缓冲）
#   /health    → AI 健康检查
#   /metrics   → AI 指标（仅内网）
#   其余全部   → Flask 主站
# =====================================================================

upstream flask_backend {
    server flask:5000;
}

upstream ai_backend {
    server ai:8100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ========== AI SSE 流式接口 ==========
    # 注意：必须走 Flask 网关（由它校验登录态、注入 X-Internal-Token / X-User-Id），
    # 不能直达 ai_backend——浏览器请求不带内部 Token，直达必被 AI 401 拒绝。
    # 网关在容器内网再转发 http://ai:8100。
    location = /api/ai/chat/stream {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式必须
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ========== AI 健康检查 ==========
    location = /health {
        proxy_pass http://ai_backend/health;
    }

    # ========== AI 指标（仅内网） ==========
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://ai_backend/metrics;
    }

    # ========== 主站（其余全部） ==========
    location / {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
